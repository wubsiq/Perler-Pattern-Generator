<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .pass { color: green; font-weight: bold; }
        .fail { color: red; font-weight: bold; }
        .item { margin: 8px 0; padding: 8px; background: #f5f5f5; border-radius: 4px; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; margin: 5px; }
    </style>
</head>
<body>
    <h1>🔍 按钮功能测试</h1>
    <div id="result"></div>
    <hr>

    <h2>手动测试按钮：</h2>
    <button onclick="testSaveBtn()">测试: 💾 保存到我的图纸</button>
    <button onclick="testMyDesignsNav()">测试: 📁 我的图纸 (导航)</button>
    <button onclick="testAllEvents()">测试: 所有按钮事件绑定</button>

    <script>
        const result = document.getElementById('result');

        function log(msg, pass = true) {
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `<span class="${pass ? 'pass' : 'fail'}">${pass ? '✅' : '❌'}</span> ${msg}`;
            result.appendChild(div);
        }

        function checkElement(id, description) {
            const el = document.getElementById(id);
            if (el) {
                const hasClickListener = el.onclick !== null;
                log(`${description} - 找到元素 (tag=${el.tagName}, text="${el.textContent.substring(0, 30)}")`);
                return el;
            } else {
                log(`${description} - ❌ 未找到元素`, false);
                return null;
            }
        }

        function testSaveBtn() {
            result.innerHTML = '';
            log('开始测试保存按钮...');

            const btn = checkElement('saveToMyDesignsBtn', '保存到我的图纸按钮');
            if (btn) {
                log('尝试点击...');
                try {
                    btn.click();
                    log('点击事件已触发');
                } catch (e) {
                    log('点击出错: ' + e.message, false);
                }
            }
        }

        function testMyDesignsNav() {
            result.innerHTML = '';
            log('开始测试我的图纸导航按钮...');

            const navBtns = document.querySelectorAll('.nav-btn');
            log(`找到 ${navBtns.length} 个导航按钮`);

            navBtns.forEach((btn, i) => {
                const section = btn.dataset.section;
                log(`导航按钮 ${i + 1}: data-section="${section}", text="${btn.textContent.trim()}"`);
                if (section === 'myDesigns') {
                    log('🎯 找到我的图纸导航按钮，尝试点击...');
                    try {
                        btn.click();
                        const section = document.getElementById('myDesignsSection');
                        if (section) {
                            log(`section 元素状态: display="${section.style.display}"`);
                        } else {
                            log('❌ 找不到 myDesignsSection', false);
                        }
                    } catch (e) {
                        log('点击出错: ' + e.message, false);
                    }
                }
            });
        }

        function testAllEvents() {
            result.innerHTML = '';
            log('检查所有关键按钮...');

            const elements = [
                ['saveToMyDesignsBtn', '保存按钮'],
                ['importDesignBtn', '导入按钮'],
                ['myDesignsSection', '我的图纸区域'],
                ['myDesignsGrid', '图纸列表'],
                ['myDesignsEmpty', '空状态提示']
            ];

            elements.forEach(([id, desc]) => {
                checkElement(id, desc);
            });

            log('检查 localStorage 是否可用...');
            try {
                localStorage.setItem('__test__', '1');
                localStorage.removeItem('__test__');
                log('localStorage 可用');
            } catch (e) {
                log('localStorage 不可用: ' + e.message, false);
            }

            log('检查 MyDesignsManager 是否已定义...');
            if (typeof MyDesignsManager !== 'undefined') {
                log('✅ MyDesignsManager 已定义');
            } else {
                log('❌ MyDesignsManager 未定义（可能是 bundle 没有包含这个模块）', false);
            }

            log('检查 InfoPaperConverter 是否已定义...');
            if (typeof InfoPaperConverter !== 'undefined') {
                log('✅ InfoPaperConverter 已定义');
            } else {
                log('❌ InfoPaperConverter 未定义', false);
            }
        }

        window.addEventListener('load', () => {
            log('页面加载完成');
            testAllEvents();
        });
    </script>

    <iframe id="testFrame" src="index.html" style="width: 100%; height: 600px; border: 1px solid #ccc; margin-top: 20px;"></iframe>
</body>
</html>
