<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>测试 - 我的图纸功能</title>
    <link rel="stylesheet" href="css/style.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; }
        h1 { color: #333; }
        .test-box { background: white; padding: 15px; margin: 10px 0; border-radius: 6px; border: 1px solid #ddd; }
        .ok { color: #28a745; font-weight: bold; }
        .bad { color: #dc3545; font-weight: bold; }
        .warn { color: #ffc107; font-weight: bold; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; margin: 5px; border: 1px solid #ccc; background: #007bff; color: white; border-radius: 4px; }
        button:hover { background: #0056b3; }
        .log { background: #222; color: #0f0; padding: 15px; font-family: monospace; border-radius: 6px; max-height: 500px; overflow-y: auto; font-size: 12px; white-space: pre-wrap; }
        code { background: #eee; padding: 2px 6px; border-radius: 3px; }
    </style>
</head>
<body>
    <h1>🔍 我的图纸功能诊断</h1>

    <div class="test-box">
        <h2>快速诊断</h2>
        <button onclick="runAllTests()">▶ 运行所有诊断</button>
        <button onclick="clearLog()">清空日志</button>
        <button onclick="goToApp()">跳转到 index.html</button>
    </div>

    <div class="test-box">
        <h3>诊断结果</h3>
        <div class="log" id="log">点击"运行所有诊断"开始检查...</div>
    </div>

    <div class="test-box">
        <h3>🛠 快速功能测试</h3>
        <button onclick="quickSaveTest()">💾 测试保存图纸</button>
        <button onclick="quickLoadTest()">📋 测试读取图纸</button>
        <button onclick="quickNavTest()">🧭 测试导航切换</button>
        <button onclick="clearMyDesigns()">🗑 清空我的图纸数据</button>
    </div>

    <div class="test-box">
        <h3>💡 使用说明</h3>
        <ol>
            <li>点击 <b>"运行所有诊断"</b> 检查基础功能是否正常</li>
            <li>如果所有检查都是 ✅ OK，但功能还是没反应 - 可能是 <b>浏览器缓存</b>，按 <b>Ctrl + Shift + R</b> 强制刷新</li>
            <li>如果出现 ❌ 错误，请把错误信息发给开发者</li>
            <li>也可以在 <code>index.html</code> 页面按 <b>F12</b> 打开开发者工具，查看 <b>Console</b> 中的错误信息</li>
        </ol>
    </div>

    <script src="js/bundle.min.js"></script>
    <script>
        function log(msg, level = 'info') {
            const logDiv = document.getElementById('log');
            const prefix = level === 'ok' ? '✅' : level === 'bad' ? '❌' : level === 'warn' ? '⚠️' : 'ℹ️';
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${time}] ${prefix} ${msg}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        function goToApp() {
            window.location.href = 'index.html';
        }

        function quickSaveTest() {
            log('--- 测试保存图纸 ---');
            try {
                const manager = new MyDesignsManager();
                const testColors = [
                    [{ code: 'H1', rgb: [200, 100, 100], name: '红色', isTransparent: false }, { code: 'H2', rgb: [100, 200, 100], name: '绿色' }],
                    [{ code: 'H2', rgb: [100, 200, 100], name: '绿色' }, { code: 'H1', rgb: [200, 100, 100], name: '红色', isTransparent: false }]
                ];
                manager.saveDesign(testColors, 2, 2, 'artkal').then(design => {
                    log('保存成功! ID: ' + design.id, 'ok');
                    const designs = manager.getAllDesigns();
                    log('当前共有 ' + designs.length + ' 张图纸', 'ok');
                }).catch(err => {
                    log('保存失败: ' + err.message, 'bad');
                    log(err.stack, 'bad');
                });
            } catch (e) {
                log('保存时出错: ' + e.message, 'bad');
                log(e.stack, 'bad');
            }
        }

        function quickLoadTest() {
            log('--- 测试读取图纸 ---');
            try {
                const manager = new MyDesignsManager();
                const designs = manager.getAllDesigns();
                log('当前共有 ' + designs.length + ' 张图纸');
                if (designs.length > 0) {
                    log('最新一张: ' + JSON.stringify({
                        id: designs[0].id,
                        width: designs[0].width,
                        height: designs[0].height,
                        hasThumb: !!designs[0].thumbnail,
                        createdAt: new Date(designs[0].createdAt).toLocaleString()
                    }, null, 2), 'ok');
                } else {
                    log('没有图纸', 'warn');
                }
            } catch (e) {
                log('读取时出错: ' + e.message, 'bad');
                log(e.stack, 'bad');
            }
        }

        function quickNavTest() {
            log('--- 测试导航切换 ---');
            try {
                // 检查导航按钮
                const navBtns = document.querySelectorAll('.nav-btn');
                log('找到 ' + navBtns.length + ' 个导航按钮');
                navBtns.forEach((btn, i) => {
                    log(`导航按钮 ${i+1}: data-section="${btn.dataset.section}"`, 'ok');
                });

                // 检查"我的图纸"section
                const section = document.getElementById('myDesignsSection');
                log('myDesignsSection 的 display: ' + (section ? section.style.display : '未找到'));

                // 检查保存按钮
                const saveBtn = document.getElementById('saveToMyDesignsBtn');
                log('saveToMyDesignsBtn: ' + (saveBtn ? '找到' : '未找到'));

                // 检查导入按钮
                const importBtn = document.getElementById('importDesignBtn');
                log('importDesignBtn: ' + (importBtn ? '找到' : '未找到'));

            } catch (e) {
                log('导航测试出错: ' + e.message, 'bad');
                log(e.stack, 'bad');
            }
        }

        function clearMyDesigns() {
            if (confirm('确定要清空所有"我的图纸"数据吗？')) {
                try {
                    localStorage.removeItem('perler_my_designs_v1');
                    log('已清空所有图纸数据', 'ok');
                } catch (e) {
                    log('清空失败: ' + e.message, 'bad');
                }
            }
        }

        async function runAllTests() {
            document.getElementById('log').innerHTML = '';
            log('========== 开始完整诊断 ==========');
            log('当前协议: ' + window.location.protocol);
            log('页面路径: ' + window.location.pathname);
            log('');

            // 1. 检查关键对象
            log('--- 检查 1: 核心对象是否定义 ---');
            const coreObjects = [
                'MyDesignsManager',
                'InfoPaperConverter',
                'InfoPaperCompressor',
                'PixelArtGenerator',
            ];
            let coreOk = true;
            coreObjects.forEach(name => {
                if (typeof window[name] !== 'undefined') {
                    log(`${name}: ✅ 已定义`, 'ok');
                } else {
                    log(`${name}: ❌ 未定义`, 'bad');
                    coreOk = false;
                }
            });

            // 2. 检查 DOM 元素
            log('');
            log('--- 检查 2: DOM 元素是否存在 ---');
            const domElements = [
                'saveToMyDesignsBtn',
                'myDesignsSection',
                'myDesignsGrid',
                'myDesignsEmpty',
                'importDesignBtn',
                'importDesignFile',
                'uploadSection',
                'workspace',
            ];
            let domOk = true;
            domElements.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    log(`${id}: ✅ 找到`, 'ok');
                } else {
                    log(`${id}: ❌ 未找到`, 'bad');
                    domOk = false;
                }
            });

            // 3. 检查导航按钮
            log('');
            log('--- 检查 3: 导航按钮 ---');
            const navBtns = document.querySelectorAll('.nav-btn');
            log(`找到 ${navBtns.length} 个导航按钮`);
            let myDesignsNavFound = false;
            navBtns.forEach((btn, i) => {
                log(`导航按钮 ${i+1}: data-section="${btn.dataset.section}"`, 'ok');
                if (btn.dataset.section === 'myDesigns') myDesignsNavFound = true;
            });
            if (myDesignsNavFound) {
                log('✅ "我的图纸"导航按钮存在', 'ok');
            } else {
                log('❌ "我的图纸"导航按钮不存在', 'bad');
            }

            // 4. 测试 localStorage
            log('');
            log('--- 检查 4: localStorage ---');
            try {
                localStorage.setItem('__test_key__', 'test_value');
                const val = localStorage.getItem('__test_key__');
                localStorage.removeItem('__test_key__');
                if (val === 'test_value') {
                    log('✅ localStorage 可用', 'ok');
                } else {
                    log('❌ localStorage 不正常', 'bad');
                }
            } catch (e) {
                log('❌ localStorage 出错: ' + e.message, 'bad');
            }

            // 5. 测试 MyDesignsManager 基本功能
            log('');
            log('--- 检查 5: MyDesignsManager 功能测试 ---');
            if (typeof MyDesignsManager !== 'undefined') {
                try {
                    const manager = new MyDesignsManager();
                    log('✅ MyDesignsManager 实例创建成功', 'ok');

                    // 测试保存
                    const testColors = [
                        [
                            { code: 'H1', rgb: [200, 100, 100], name: '红', isTransparent: false },
                            { code: 'H2', rgb: [100, 200, 100], name: '绿', isTransparent: false }
                        ],
                        [
                            { code: 'H2', rgb: [100, 200, 100], name: '绿', isTransparent: false },
                            { code: 'H1', rgb: [200, 100, 100], name: '红', isTransparent: false }
                        ]
                    ];
                    await manager.saveDesign(testColors, 2, 2, 'artkal');
                    log('✅ 保存图纸成功', 'ok');

                    const afterSave = manager.getAllDesigns();
                    log('当前图纸数量: ' + afterSave.length, 'ok');

                    if (afterSave.length > 0) {
                        // 测试加载
                        const loaded = await manager.loadDesign(afterSave[0].id);
                        log('✅ 加载图纸成功', 'ok');
                        log(`加载结果: ${loaded.width}x${loaded.height}, 颜色数: ${loaded.perlerColors.length}`, 'ok');

                        // 测试删除
                        const testId = afterSave[0].id;
                        manager.deleteDesign(testId);
                        const afterDelete = manager.getAllDesigns();
                        log('✅ 删除图纸成功 (剩余 ' + afterDelete.length + ' 张)', 'ok');
                    }

                } catch (e) {
                    log('❌ MyDesignsManager 功能测试失败: ' + e.message, 'bad');
                    log(e.stack, 'bad');
                }
            } else {
                log('❌ MyDesignsManager 未定义，跳过功能测试', 'bad');
            }

            // 6. 测试按钮点击
            log('');
            log('--- 检查 6: 按钮事件绑定测试 ---');
            const saveBtn = document.getElementById('saveToMyDesignsBtn');
            if (saveBtn) {
                saveBtn.click();
                log('✅ saveToMyDesignsBtn 点击事件已触发 (如果没有渲染图纸，会提示"请先渲染拼豆图纸")', 'ok');
            }

            log('');
            log('========== 诊断完成 ==========');
            if (coreOk && domOk) {
                log('🎉 核心功能都是正常的！如果按钮还是没反应，请尝试:', 'ok');
                log('   1. 按 Ctrl + Shift + R 强制刷新清除缓存', 'warn');
                log('   2. 在 index.html 页面按 F12 查看 Console 错误', 'warn');
                log('   3. 检查是否先渲染了拼豆图纸（保存按钮需要先有图纸数据）', 'warn');
            } else {
                log('⚠️ 发现问题，请把上方 ❌ 的信息发给开发者', 'warn');
            }
        }

        // 页面加载完成后自动运行基本检查
        window.addEventListener('load', () => {
            log('页面加载完成');
            log('提示: 点击"运行所有诊断"进行完整检查');
            log('');
        });
    </script>
</body>
</html>
