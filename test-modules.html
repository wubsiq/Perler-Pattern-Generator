<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module Test - BeanMaster</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .test-section {
            margin-bottom: 30px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
        }
        .test-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .test-content {
            padding: 20px;
        }
        .module-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        .module-card {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            background: #f8f9fa;
            transition: all 0.3s ease;
        }
        .module-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .module-card.success {
            border-color: #10b981;
            background: #ecfdf5;
        }
        .module-card.error {
            border-color: #ef4444;
            background: #fef2f2;
        }
        .module-card.warning {
            border-color: #f59e0b;
            background: #fffbeb;
        }
        .module-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .module-status {
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 500;
        }
        .status-ok {
            background: #10b981;
            color: white;
        }
        .status-error {
            background: #ef4444;
            color: white;
        }
        .status-warning {
            background: #f59e0b;
            color: white;
        }
        .module-desc {
            font-size: 13px;
            color: #666;
            margin-bottom: 10px;
        }
        .test-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
        }
        .test-btn:hover {
            background: #5a67d8;
            transform: scale(1.05);
        }
        .test-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .log-area {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 15px;
        }
        .log-line {
            padding: 3px 0;
            border-bottom: 1px solid #333;
        }
        .log-line.info { color: #60a5fa; }
        .log-line.success { color: #10b981; }
        .log-line.error { color: #ef4444; }
        .log-line.warning { color: #f59e0b; }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }
        .btn-secondary:hover {
            background: #d1d5db;
        }
        .summary-stats {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            padding: 20px;
            background: #f0f9ff;
            border-radius: 10px;
        }
        .stat {
            text-align: center;
        }
        .stat-value {
            font-size: 32px;
            font-weight: 700;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
        }
        .stat-value.success { color: #10b981; }
        .stat-value.error { color: #ef4444; }
        .stat-value.warning { color: #f59e0b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Module Test Console</h1>
        <p class="subtitle">Test all modules for the BeanMaster project</p>

        <div class="test-section">
            <div class="test-header">Module Loading Test</div>
            <div class="test-content">
                <div class="module-grid" id="moduleGrid"></div>
                <div class="summary-stats" id="summaryStats" style="display: none;"></div>
            </div>
        </div>

        <div class="test-section">
            <div class="test-header">Test Logs</div>
            <div class="test-content">
                <div class="log-area" id="logArea"></div>
                <div class="action-buttons">
                    <button class="btn btn-primary" id="runAllTestsBtn">Run All Tests</button>
                    <button class="btn btn-secondary" id="clearLogBtn">Clear Log</button>
                    <button class="btn btn-secondary" id="goToAppBtn">Open Main App</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const modulesToTest = [
            { name: 'StateManager', desc: 'State Management', file: 'modules/StateManager.js' },
            { name: 'Pixelator', desc: 'Pixelation Processor', file: 'modules/Pixelator.js' },
            { name: 'PerlerGenerator', desc: 'Perler Chart Generator', file: 'modules/PerlerGenerator.js' },
            { name: 'ImageUploader', desc: 'Image Upload Handler', file: 'modules/ImageUploader.js' },
            { name: 'DownloadManager', desc: 'Download Manager', file: 'modules/DownloadManager.js' },
            { name: 'SnapshotManager', desc: 'Snapshot Manager', file: 'modules/SnapshotManager.js' },
            { name: 'CustomEditor', desc: 'Custom Editor', file: 'modules/CustomEditor.js' },
            { name: 'SmartOptimizer', desc: 'Smart Optimizer', file: 'modules/SmartOptimizer.js' },
            { name: 'CarveSplitter', desc: 'Carve Splitter', file: 'modules/CarveSplitter.js' },
            { name: 'PixelArtProcessor', desc: 'Pixel Art Processor', file: 'modules/PixelArtProcessor.js' },
            { name: 'ColorManager', desc: 'Color Manager', file: 'modules/ColorManager.js' },
            { name: 'CanvasRenderer', desc: 'Canvas Renderer', file: 'modules/CanvasRenderer.js' },
            { name: 'UIController', desc: 'UI Controller', file: 'modules/UIController.js' }
        ];

        const logArea = document.getElementById('logArea');
        const moduleGrid = document.getElementById('moduleGrid');
        const summaryStats = document.getElementById('summaryStats');

        let testResults = {
            success: 0,
            error: 0,
            warning: 0
        };

        function log(message, type = 'info') {
            const line = document.createElement('div');
            line.className = 'log-line ' + type;
            const time = new Date().toLocaleTimeString();
            line.textContent = '[' + time + '] ' + message;
            logArea.appendChild(line);
            logArea.scrollTop = logArea.scrollHeight;
        }

        function createModuleCards() {
            modulesToTest.forEach(function(module) {
                const card = document.createElement('div');
                card.className = 'module-card';
                card.id = 'card-' + module.name;
                card.innerHTML = '' +
                    '<div class="module-name">' +
                        module.name +
                        '<span class="module-status" id="status-' + module.name + '">Pending</span>' +
                    '</div>' +
                    '<div class="module-desc">' + module.desc + '</div>' +
                    '<button class="test-btn" id="test-' + module.name + '">Test</button>';
                moduleGrid.appendChild(card);
            });
        }

        function updateModuleStatus(moduleName, status, message) {
            const card = document.getElementById('card-' + moduleName);
            const statusEl = document.getElementById('status-' + moduleName);
            const btn = document.getElementById('test-' + moduleName);

            if (card) {
                card.className = 'module-card ' + status;
            }
            if (statusEl) {
                statusEl.className = 'module-status status-' + status;
                statusEl.textContent = status === 'success' ? 'OK' :
                                        status === 'error' ? 'Error' :
                                        status === 'warning' ? 'Warning' : 'Pending';
            }
            if (btn) {
                btn.textContent = status === 'success' ? 'Tested' : 'Retest';
            }

            if (status === 'success') testResults.success++;
            else if (status === 'error') testResults.error++;
            else if (status === 'warning') testResults.warning++;

            updateSummaryStats();
        }

        function updateSummaryStats() {
            summaryStats.style.display = 'flex';
            summaryStats.innerHTML = '' +
                '<div class="stat">' +
                    '<div class="stat-value success">' + testResults.success + '</div>' +
                    '<div class="stat-label">OK</div>' +
                '</div>' +
                '<div class="stat">' +
                    '<div class="stat-value warning">' + testResults.warning + '</div>' +
                    '<div class="stat-label">Warning</div>' +
                '</div>' +
                '<div class="stat">' +
                    '<div class="stat-value error">' + testResults.error + '</div>' +
                    '<div class="stat-label">Error</div>' +
                '</div>' +
                '<div class="stat">' +
                    '<div class="stat-value">' + (testResults.success + testResults.warning + testResults.error) + '</div>' +
                    '<div class="stat-label">Tested</div>' +
                '</div>';
        }

        async function testModule(moduleInfo) {
            log('Testing ' + moduleInfo.name + '...', 'info');

            try {
                const globalName = moduleInfo.name.charAt(0).toLowerCase() + moduleInfo.name.slice(1);
                const globalInstance = window[globalName];

                if (globalInstance) {
                    log(moduleInfo.name + ': Global instance found: ' + globalName, 'success');

                    if (typeof globalInstance === 'object' || typeof globalInstance === 'function') {
                        const methods = Object.getOwnPropertyNames(globalInstance)
                            .filter(function(p) { return typeof globalInstance[p] === 'function'; })
                            .slice(0, 5);

                        if (methods.length > 0) {
                            log(moduleInfo.name + ': Methods found: ' + methods.join(', '), 'info');
                        }

                        updateModuleStatus(moduleInfo.name, 'success', 'OK');
                        log(moduleInfo.name + ' test passed!', 'success');
                    } else {
                        updateModuleStatus(moduleInfo.name, 'warning', 'Warning');
                        log(moduleInfo.name + ': Invalid instance type', 'warning');
                    }
                } else {
                    const classExists = window[moduleInfo.name];
                    if (classExists) {
                        log(moduleInfo.name + ': Class found', 'success');
                        updateModuleStatus(moduleInfo.name, 'success', 'OK');
                        log(moduleInfo.name + ' test passed!', 'success');
                    } else {
                        log(moduleInfo.name + ': Instance or class not found', 'warning');
                        updateModuleStatus(moduleInfo.name, 'warning', 'Warning');
                    }
                }
            } catch (error) {
                log(moduleInfo.name + ' test failed: ' + error.message, 'error');
                updateModuleStatus(moduleInfo.name, 'error', 'Error');
            }
        }

        async function runAllTests() {
            log('========== Starting all tests ==========', 'info');
            testResults = { success: 0, error: 0, warning: 0 };

            for (let i = 0; i < modulesToTest.length; i++) {
                await testModule(modulesToTest[i]);
                await new Promise(function(resolve) { setTimeout(resolve, 100); });
            }

            log('========== All tests completed ==========', 'info');
            log('Results: ' + testResults.success + ' OK, ' + testResults.warning + ' warnings, ' + testResults.error + ' errors',
                testResults.error > 0 ? 'error' : 'success');
        }

        function setupEventListeners() {
            document.getElementById('runAllTestsBtn').addEventListener('click', runAllTests);

            document.getElementById('clearLogBtn').addEventListener('click', function() {
                logArea.innerHTML = '';
                testResults = { success: 0, error: 0, warning: 0 };
                updateSummaryStats();
                modulesToTest.forEach(function(m) {
                    const card = document.getElementById('card-' + m.name);
                    if (card) card.className = 'module-card';
                    const status = document.getElementById('status-' + m.name);
                    if (status) {
                        status.className = 'module-status';
                        status.textContent = 'Pending';
                    }
                    const btn = document.getElementById('test-' + m.name);
                    if (btn) btn.textContent = 'Test';
                });
            });

            document.getElementById('goToAppBtn').addEventListener('click', function() {
                window.location.href = 'index.html';
            });

            modulesToTest.forEach(function(module) {
                const btn = document.getElementById('test-' + module.name);
                if (btn) {
                    btn.addEventListener('click', function() {
                        testModule(module);
                    });
                }
            });
        }

        function init() {
            log('Module test console initialized', 'success');
            log('Click "Run All Tests" to start', 'info');
            createModuleCards();
            setupEventListeners();
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>

    <script src="modules/StateManager.js" defer></script>
    <script src="modules/Pixelator.js" defer></script>
    <script src="modules/PerlerGenerator.js" defer></script>
    <script src="modules/ImageUploader.js" defer></script>
    <script src="modules/DownloadManager.js" defer></script>
    <script src="modules/SnapshotManager.js" defer></script>
    <script src="modules/CustomEditor.js" defer></script>
    <script src="modules/SmartOptimizer.js" defer></script>
    <script src="modules/CarveSplitter.js" defer></script>
    <script src="modules/PixelArtProcessor.js" defer></script>
    <script src="modules/ColorManager.js" defer></script>
    <script src="modules/CanvasRenderer.js" defer></script>
    <script src="modules/UIController.js" defer></script>
</body>
</html>
